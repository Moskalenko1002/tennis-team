<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TennisTeam — клуб настільного тенісу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F8;--card:#fff;--ink:#0E2238;--mute:#5B6B7D;--table:#14509C;--table2:#0F3F7E;--ball:#FF7A1A;--line:#DCE3EA;--ok:#1E8E5A;--r:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1624;--card:#13243A;--ink:#EAF0F6;--mute:#93A3B5;--line:#223650;--table:#1B63BE;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Onest,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:Unbounded,Onest,sans-serif;line-height:1.15;margin:0}
h2{font-size:1.5rem;margin-bottom:.4rem}
a{color:var(--table)}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.bar{max-width:960px;margin:auto;display:flex;align-items:center;gap:1rem;padding:.6rem 1rem}
.logo{font-family:Unbounded,sans-serif;font-weight:800;text-decoration:none;color:var(--ink);white-space:nowrap}
.logo i{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--ball);margin-right:.35em}
nav{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none}
nav a{padding:.4rem .75rem;border-radius:99px;text-decoration:none;color:var(--mute);white-space:nowrap;font-weight:500}
nav a.on{background:var(--ink);color:var(--bg)}
nav a:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
main{max-width:960px;margin:auto;padding:1rem 1rem 4rem}
.sub{color:var(--mute);margin:0 0 1.2rem}
.hero{position:relative;background:var(--table);border-radius:var(--r);padding:2.2rem 1.4rem 2rem;color:#fff;overflow:hidden;margin-bottom:1.2rem;box-shadow:inset 0 0 0 6px var(--table2)}
.hero:before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;background:rgba(255,255,255,.85)}
.hero:after{content:"";position:absolute;top:0;bottom:0;left:50%;width:6px;margin-left:-3px;background:rgba(255,255,255,.2)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(2rem,8vw,3.6rem);font-weight:800;background:var(--table);display:inline-block;padding:0 .4rem;margin-left:-.4rem}
.hero p{max-width:30ch;font-size:1.1rem;background:var(--table);padding:.2rem .4rem;margin:.8rem 0 1.2rem -.4rem}
.ball{position:absolute!important;right:12%;top:18%;width:34px;height:34px;border-radius:50%;background:var(--ball);box-shadow:0 14px 0 -6px rgba(0,0,0,.25);animation:bounce 1.6s ease-in-out infinite alternate;z-index:2}
@keyframes bounce{to{transform:translate(-40px,60px)}}
@media (prefers-reduced-motion:reduce){.ball{animation:none}}
.btn{display:inline-block;background:var(--ball);color:#1b1000;font-weight:700;text-decoration:none;padding:.7rem 1.1rem;border-radius:99px}
.btn.alt{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem}
.card h3{font-size:1rem;margin-bottom:.3rem}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:.1rem .55rem;border-radius:99px;background:var(--line);color:var(--ink)}
.tag.up{background:var(--ball);color:#1b1000}.tag.done{background:var(--ok);color:#fff}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:.65rem .8rem;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;font-size:.9rem}
tr:last-child td{border-bottom:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.av{position:relative;width:64px;height:64px;border-radius:50%;background:var(--table);color:#fff;display:grid;place-items:center;font-family:Unbounded,sans-serif;font-weight:600;overflow:hidden;flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.s{width:36px;height:36px;font-size:.75rem}
.who{display:flex;gap:.8rem;align-items:center}
.pl{display:flex;gap:.8rem;align-items:center}
.big{font-family:Unbounded,sans-serif;font-size:1.5rem;font-weight:800}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.15rem .8rem;margin:.7rem 0;font-size:.92rem}
.kv dt{color:var(--mute)}.kv dd{margin:0}
summary{cursor:pointer;color:var(--table);font-weight:500;margin-top:.5rem}
.m{display:flex;justify-content:space-between;gap:.5rem;padding:.3rem 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.w{color:var(--ok);font-weight:700}.l{color:#C0392B;font-weight:700}
.note{font-size:.85rem;color:var(--mute);margin-top:1rem}
a.card{display:block;text-decoration:none;color:inherit}
a.card .go{color:var(--table);font-weight:700;margin-top:.6rem;display:block}
table.ct{min-width:0}
.ct th,.ct td{padding:.45rem .55rem;text-align:center;white-space:nowrap}
.ct td:nth-child(2),.ct th:nth-child(2){text-align:left}
.ct td.self{background:var(--line)}
select.sel{flex:1;min-width:150px;padding:.6rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,15,28,.6);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{position:relative;background:var(--bg);width:100%;max-width:960px;max-height:92vh;display:flex;flex-direction:column;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sc{overflow:auto;overscroll-behavior:contain;padding:3.4rem 1rem calc(2rem + env(safe-area-inset-bottom,0px))}
.x{position:absolute;top:.7rem;right:.8rem;width:40px;height:40px;border-radius:50%;border:0;background:var(--line);color:var(--ink);font-size:1.6rem;line-height:1;cursor:pointer;z-index:2}
.x:focus-visible,.tile:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px;max-height:86vh}}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;margin:1.2rem 0}
.tile{display:flex;justify-content:space-between;align-items:center;gap:.5rem;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1rem;font-family:Unbounded,Onest,sans-serif;font-weight:600;font-size:.95rem;text-decoration:none;color:var(--ink)}
.tile:after{content:"→";color:var(--ball);font-weight:800}
.card.accent{border:2px solid var(--ball);margin:1.2rem 0}
.when{font-weight:700}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.2rem 1rem;padding:.95rem 1rem;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row b{margin-left:auto;white-space:nowrap}
.days{display:flex;flex-direction:column;gap:.3rem;margin:.6rem 0}
.day{font-weight:700}
.day:before{content:"";display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--ball);margin-right:.55em}
.time{font-family:Unbounded,Onest,sans-serif;font-size:1.25rem;font-weight:600;margin:.3rem 0}
/* ---- рух і характер ---- */
.hero{padding-bottom:7.2rem;text-align:center}
.hero h1{margin-left:0}
.hero p{margin:.8rem auto 1.2rem}
.hero h1{letter-spacing:-.02em}
.lane{position:absolute;left:0;right:0;bottom:0;height:96px;pointer-events:none;z-index:1;background:linear-gradient(to top,rgba(255,255,255,.14),transparent)}
.bw{position:absolute;bottom:14px;left:6%;width:30px;height:30px;animation:cross 3.2s linear infinite alternate}
@keyframes cross{to{left:calc(94% - 30px)}}
.bl{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffbe80,var(--ball) 55%,#d9560a);animation:hop 1.6s infinite}
@keyframes hop{0%{transform:translateY(-62px);animation-timing-function:ease-in}25%{transform:translateY(0);animation-timing-function:ease-out}50%{transform:translateY(-62px);animation-timing-function:ease-in}75%{transform:translateY(0);animation-timing-function:ease-out}100%{transform:translateY(-62px)}}
.sd{position:absolute;left:2px;right:2px;bottom:-9px;height:8px;border-radius:50%;background:rgba(0,0,0,.35);animation:shd 1.6s infinite}
@keyframes shd{0%,50%,100%{transform:scale(.45);opacity:.15}25%,75%{transform:scale(1);opacity:.4}}
.hero h1,.hero p,.hero .btn{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.hero p{animation-delay:.12s}.hero .btn{animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.modal{animation:fade .2s ease-out}
.sheet{animation:slide .32s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateY(44px);opacity:0}}
.tile{position:relative;overflow:hidden;padding-left:1.4rem}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,var(--ball))}
.tile,.btn,a.card{transition:transform .15s ease,box-shadow .2s ease}
.tile:active,.btn:active,a.card:active{transform:scale(.97)}
@media(hover:hover){.tile:hover,a.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(14,34,56,.14)}}
.card.accent .tag:before{content:"";display:inline-block;width:.5em;height:.5em;border-radius:50%;background:#1b1000;margin-right:.45em;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
.lead .av{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--ball)}
.rk{display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.pos{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--line);flex:none}
.p1{background:#F5C542;color:#3a2a00}.p2{background:#C9D1DA;color:#1f2933}.p3{background:#D99A5B;color:#3a1f00}
.who2{flex:1;min-width:0}.who2 small{color:var(--mute)}
.meter{height:6px;border-radius:99px;background:var(--line);margin:.3rem 0;overflow:hidden}
.meter i{display:block;height:100%;width:var(--w);border-radius:99px;background:linear-gradient(90deg,var(--table),var(--ball));transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms)}
@keyframes grow{from{transform:scaleX(0)}}
.pts{font-family:Unbounded,Onest,sans-serif;font-size:1.1rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.bl{transform:none}}
/* ---- карусель розділів ---- */
.car{position:relative;display:flex;gap:.8rem;overflow-x:auto;scroll-snap-type:x mandatory;margin:1.2rem -1rem -.4rem;padding:.4rem 1rem 1.8rem;scroll-padding:0 1rem;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 min(74vw,270px);height:190px;scroll-snap-align:start;border-radius:20px;padding:1.1rem;color:#fff;text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;gap:.25rem;overflow:hidden;background:linear-gradient(145deg,var(--c),var(--c2));box-shadow:0 10px 24px rgba(0,0,0,.18);animation:pop .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms);transition:transform .15s ease}
@keyframes pop{from{opacity:0;transform:translateX(40px) scale(.92)}}
.slide:active{transform:scale(.97)}
.slide:before{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.14)}
.slide .ic{position:absolute;right:1rem;top:.8rem;font-size:2.6rem;line-height:1}
.slide b{font-family:Unbounded,Onest,sans-serif;font-size:1.15rem;line-height:1.15}
.slide small{opacity:.92;font-size:.85rem;line-height:1.3;max-width:72%}
.slide .arr{position:absolute;right:1rem;bottom:1rem;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-weight:800}
.dots{display:flex;justify-content:center;gap:.4rem;margin:-.2rem 0 1.2rem}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line);transition:width .25s,background .25s;cursor:pointer}
.dots i.on{width:22px;background:var(--ball)}
/* ---- картка гравця, статистика ---- */
.av.m{width:52px;height:52px;font-size:.9rem}
.av.sq{width:112px;height:112px;border-radius:22px;font-size:1.6rem;background:#1B3A5E}
.pc{display:flex;align-items:center;gap:.8rem;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.8rem;text-decoration:none;color:inherit;transition:transform .15s ease}
.pc:active,.sr:active,a.rk:active{transform:scale(.98)}
.pr{display:flex;flex-direction:column;align-items:flex-end;gap:.25rem}
a.rk,.sr{text-decoration:none;color:inherit}
.sr{display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.sr:last-child{border-bottom:0}
.wl{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line);margin:.35rem 0}
.wl i{display:block;height:100%;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.wl .g{background:#1E8E5A}.wl .r{background:#D64545}
.vs{height:10px;border-radius:99px;background:var(--table);overflow:hidden;margin:.8rem 0}
.vs i{display:block;height:100%;background:var(--ball);border-radius:99px}
.pcard{background:linear-gradient(160deg,#12304F,#0B1624);color:#EAF0F6;border-radius:22px;padding:1rem}
.pcard h2{font-size:1.15rem;color:#fff;margin:.5rem 0 .2rem}
.pcard h3{font-size:1rem;color:#fff;margin:1.4rem 0 .4rem}
.ph{display:flex;gap:1rem;align-items:flex-start}
.pi{min-width:0}
.lg{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .6rem;border-radius:99px}
.lg.o{background:rgba(255,122,26,.25);color:#FFB27A}.lg.b{background:rgba(255,255,255,.18);color:#fff}
.ps{color:#93A3B5;font-size:.9rem}.ps b{color:#fff}
.pn{font-family:Unbounded,Onest,sans-serif;font-size:2rem;font-weight:800;color:#FF7A1A;line-height:1.1;margin-top:.4rem}
.pt{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:1rem 0 0}
.pt div{background:rgba(255,255,255,.07);border-radius:16px;padding:.8rem 1rem}
.pt b{display:block;font-family:Unbounded,Onest,sans-serif;font-size:1.6rem}
.pt span{color:#93A3B5;font-size:.85rem}
.pt div:nth-child(2) b{color:#4FD19A}.pt div:nth-child(3) b{color:#FF7272}
.rc{width:100%;height:auto;display:block}
.rcl{display:flex;justify-content:space-between;color:#93A3B5;font-size:.85rem}.rcl b{color:#fff}
.mr{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.65rem 0;border-bottom:1px solid rgba(255,255,255,.1)}
.mr:last-child{border-bottom:0}
.mr small{color:#93A3B5}
.pill{white-space:nowrap;font-size:.85rem;font-weight:700;padding:.25rem .65rem;border-radius:99px;background:rgba(255,255,255,.12);color:#EAF0F6}
.pill.w{background:rgba(79,209,154,.16);color:#4FD19A}.pill.l{background:rgba(255,114,114,.16);color:#FF7272}
/* ---- верхній блок ---- */
.hx{position:relative;overflow:hidden;border-radius:22px;padding:24px;margin-bottom:1.2rem;color:#fff;display:flex;flex-direction:column;gap:16px;background-color:#0B1624;background-image:radial-gradient(circle at 90% 4%,rgba(255,122,26,.30),rgba(255,122,26,0) 44%),linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:auto,40px 40px,40px 40px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.hx-top{display:flex;align-items:center;justify-content:space-between;gap:12px;white-space:nowrap}
.hx-logo{display:flex;align-items:center;gap:10px;font-family:Unbounded,Onest,sans-serif;font-weight:800;font-size:16px}
.hx-logo i{width:14px;height:14px;border-radius:50%;background:#FF7A1A}
.hx-eye{font-size:11px;font-weight:800;letter-spacing:.1em;color:#FF9A55}
.hx svg{display:block;width:100%;height:auto}
.hx-p{margin:0;text-align:center;font-size:16px;line-height:1.5;color:#C4CFDB}
.hx-p b{display:block;font-size:20px;font-weight:700;color:#fff;line-height:1.3}
.hx-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hx-stats div{background:#172E49;border-radius:14px;padding:10px;text-align:center;font-size:12px;color:#A9B6C5}
.hx-stats b{display:block;font-family:Unbounded,Onest,sans-serif;font-weight:800;font-size:22px;color:#FF7A1A}
.hx-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hb{min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:99px;font-weight:700;font-size:14px;text-decoration:none;box-sizing:border-box;padding:0 8px;transition:transform .15s ease}
.hb:active{transform:scale(.97)}
.hb.o{background:#FF7A1A;color:#1B1000}.hb.l{border:2px solid #fff;color:#fff}.hb.w{background:#fff;color:#0B1624}
.hb:focus-visible{outline:3px solid #FF7A1A;outline-offset:2px}
/* ---- низ: контакти і лідер ---- */
.ct2{background:#172E49;color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;margin-top:1.2rem}
.ct2-k{font-size:12px;font-weight:800;letter-spacing:.16em;color:#FF9A55}
.ct2-ad{font-family:Unbounded,Onest,sans-serif;font-weight:800;font-size:18px;line-height:1.25}
.ct2-ph{font-size:18px;font-weight:700;color:#C4CFDB}
.ct2-bb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lb{display:flex;align-items:center;gap:16px;margin-top:1rem;padding:18px;border-radius:20px;background:linear-gradient(135deg,#D55800,#A94200);color:#fff;text-decoration:none;transition:transform .15s ease}
.lb:active{transform:scale(.98)}
.lb .av{width:72px;height:72px;font-size:1.2rem;background:#1B3A5E;box-shadow:0 0 0 3px #A94200,0 0 0 6px #fff}
.lb small{display:block;font-size:12px;font-weight:800;letter-spacing:.16em}
.lb b{display:block;font-family:Unbounded,Onest,sans-serif;font-size:18px;line-height:1.25;margin:2px 0}
.lb span{font-size:16px;font-weight:700}
</style>
</head>

<header><div class="bar">
<a class="logo" href="#home"><i></i>TennisTeam</a>
</div></header>

<script>
/* ====== ТУТ ЗМІНЮЄТЬСЯ ВЕСЬ ВМІСТ САЙТУ ====== */
const B = "Біла ліга", O = "Оранжева ліга"; /* назви ліг: Біла — слабша, Оранжева — сильніша */
const DATA = {

    { title: "Тренування", days: [], time: "За домовленістю", coach: "Гончаренко Мілена Максимівна" }

  rent: [
    { name: "Стіл, 1 година", price: "250 ₴" },
    { name: "Ракетки та 30 м’ячів", price: "входять у вартість" }
  ],
  /* Для кожного гравця можна додати: age, hand, grip, since, bio — вони з’являться в картці */

    <div class="grid">${DATA.schedule.map(s => `<div class="card"><h3>${s.title}</h3>
      ${s.days.length ? `<div class="days">${s.days.map(d => `<span class="day">${d}</span>`).join("")}</div>` : ""}
      <div class="time">${s.time}</div>${s.note ? `<p class="note" style="margin:.3rem 0 0">${s.note}</p>` : ""}
      <p class="note" style="margin:.7rem 0 0">Тренер: <b>${s.coach}</b></p></div>`).join("")}</div>`,
  rent: () => `
    <h2>Оренда столів</h2><p class="sub">Бронювання за телефоном.</p>
    <div class="list">${DATA.rent.map(r => `<div class="row"><span>${r.name}</span><b>${r.price}</b></div>`).join("")}</div>
    <p><a class="btn" href="tel:${DATA.club.phone.replace(/\s/g, "")}">Забронювати стіл</a></p>`,
  tournaments: () => `
    <h2>Турніри</h2><p class="sub">Результати йдуть у рейтинг гравців. Натисніть на завершений турнір, щоб побачити таблиці.</p>
    <div class="grid">${[...DATA.tournaments].sort((x, y) => (x.status === "up" ? 0 : 1) - (y.status === "up" ? 0 : 1) || (x.status === "up" ? x.date.localeCompare(y.date) : y.date.localeCompare(x.date))).map(t => {
      const link = t.id && t.status === "done";
      return `<${link ? `a href="#t-${t.id}"` : "div"} class="card"><span class="tag ${t.status}">${t.status === "up" ? "Незабаром" : "Завершено"}</span>
      <h3 style="margin-top:.5rem">${t.name}</h3>${fmt(t.date)}${t.time ? " о " + t.time : ""}${t.place ? "<br>" + t.place : ""}
      <p class="note">${t.winners ? t.winners.map(w => w.g + ": <b>" + P[w.id].name + "</b>").join("<br>") : (t.info || "")}</p>${link ? '<span class="go">Дивитись таблиці →</span>' : ""}${t.status === "up" ? `<a class="btn" style="margin-top:.4rem" href="tel:${DATA.club.phone.replace(/\s/g, "")}">Записатися за телефоном</a>` : ""}</${link ? "a" : "div"}>`;
    }).join("")}</div>`,
  tournament: id => {
    const t = DATA.tournaments.find(x => x.id === id);
    if (!t) return views.tournaments();
    const ms = DATA.matches.filter(m => m.tid === id);
    const groups = [...new Set(ms.map(m => m.t))];
    return `<p><a href="#tournaments">← Усі турніри</a></p><h2>${t.name}</h2><p class="sub">${fmt(t.date)} · ${t.place}</p>${groups.map(g => crossTable(g, ms.filter(m => m.t === g))).join("")}<p class="note">Очки: 2 за перемогу, 1 за поразку. Місце визначається за очками, потім за різницею сетів.</p>`;
  },
  stats: () => `
    <h2>Очна статистика</h2><p class="sub">Оберіть двох гравців — побачите, хто частіше вигравав.</p>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem">${["a", "b"].map(k => `<select class="sel" aria-label="Гравець" onchange="H.${k}=this.value;document.getElementById('h2h').innerHTML=renderH2H()"><option value="">Оберіть гравця</option>${ranked.map(p => `<option value="${p.id}" ${H[k] === p.id ? "selected" : ""}>${p.name}</option>`).join("")}</select>`).join("")}</div>
    <div id="h2h">${renderH2H()}</div>
    <h2 style="margin-top:1.8rem">Статистика гравців</h2><p class="sub">За всі турніри клубу. Зелене — перемоги, червоне — поразки.</p>
    <div class="list">${[...ranked].sort((x, y) => (y.w / ((y.w + y.l) || 1)) - (x.w / ((x.w + x.l) || 1)) || (y.w + y.l) - (x.w + x.l)).map((p, i) => { const g = p.w + p.l; return `<a class="sr" href="#p-${p.id}"><span class="pos">${i + 1}</span><div class="who2"><b>${p.name}</b><div class="wl">${g ? `<i class="g" style="width:${100 * p.w / g}%"></i><i class="r" style="width:${100 * p.l / g}%"></i>` : ""}</div><small>Ігор ${g} · перемог ${p.w} · поразок ${p.l}</small></div><b class="pts">${pct(p.w, g)}</b></a>`; }).join("")}</div>`,
  rating: () => {
    const hi = ranked[0].r, lo = Math.min(...ranked.map(p => p.r));
    return `
    <h2>Рейтинг клубу</h2><p class="sub">Система Elo: усі починають із ${START}. Перемога над сильнішим суперником дає більше очок.</p>
    <div class="list">${ranked.map((p, i) => `<a class="rk" href="#p-${p.id}"><span class="pos p${i < 3 ? i + 1 : 0}">${i + 1}</span>${av(p, "s")}<div class="who2"><b>${p.name}</b><div class="meter"><i style="--w:${Math.max(6, Math.round(100 * (p.r - lo + 15) / (hi - lo + 15)))}%;--i:${i}"></i></div><small>${p.w + p.l} ігор, перемог ${p.w}, поразок ${p.l}</small></div><b class="pts">${Math.round(p.r)}</b></a>`).join("")}</div>`;
  },
  players: () => `
    <h2>Гравці клубу</h2><p class="sub">Натисніть на гравця, щоб відкрити його картку.</p>
    <div class="grid">${ranked.map((p, i) => { const g = p.w + p.l; return `<a class="pc" href="#p-${p.id}">${av(p, "m")}<div class="who2"><b>${p.name}</b><br><small>${p.group || ""}</small><div class="wl">${g ? `<i class="g" style="width:${100 * p.w / g}%"></i><i class="r" style="width:${100 * p.l / g}%"></i>` : ""}</div></div><div class="pr"><span class="tag">#${i + 1}</span><b class="pts">${Math.round(p.r)}</b></div></a>`; }).join("")}</div>`,
  player: id => {
    const p = P[id];
    if (!p) return views.players();
    const i = ranked.findIndex(x => x.id === id), g = p.w + p.l;
    const tl = DATA.tournaments.map(t => {
      const mine = DATA.matches.filter(m => m.tid === t.id && (m.a === id || m.b === id));
      if (!mine.length) return "";
      const grp = mine[0].t, [pl, n] = placeIn(DATA.matches.filter(m => m.tid === t.id && m.t === grp), id);
      return `<div class="mr"><span>${t.name}<br><small>${grp}</small></span><span class="pill ${pl === 1 ? "w" : ""}">${pl === 1 ? "🥇 " : ""}${pl} місце з ${n}</span></div>`;
    }).join("");
    const last = [...p.h].reverse().slice(0, 10).map(h => `<div class="mr"><span>${P[h.o].name}<br><small>${sd(h.d)} · ${h.dr >= 0 ? "+" : "−"}${Math.abs(Math.round(h.dr))} очок</small></span><span class="pill ${h.win ? "w" : "l"}">${h.f}:${h.g} ${h.win ? "Перемога" : "Поразка"}</span></div>`).join("");
    const det = [p.hand ? ["Рука", p.hand + (p.grip ? ", " + p.grip : "")] : null, p.since ? ["У клубі з", p.since] : null, p.age ? ["Вік", p.age] : null].filter(Boolean).map(x => `<div class="mr"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("");
    return `<p><a href="#players">← Усі гравці</a></p>
    <div class="pcard">
      <div class="ph">${av(p, "sq")}<div class="pi"><span class="lg ${p.group === O ? "o" : "b"}">${p.group || "Гравець"}</span><h2>${p.name}</h2><div class="ps">Гравець TennisTeam${p.born ? " · " + p.born + " р.н." : ""}</div><div class="pn">№ ${String(i + 1).padStart(2, "0")}</div><div class="ps">Місце в рейтингу · <b>${Math.round(p.r)}</b></div></div></div>
      <div class="pt"><div><b>${g}</b><span>Матчів</span></div><div><b>${p.w}</b><span>Перемог</span></div><div><b>${p.l}</b><span>Поразок</span></div><div><b>${pct(p.w, g)}</b><span>Перемог, %</span></div></div>
      <h3>Динаміка рейтингу</h3>${ratingChart(p.rh)}
      ${tl ? `<h3>Турніри</h3>${tl}` : ""}
      <h3>Останні матчі</h3>${last || `<p class="ps">Матчів поки немає.</p>`}
      ${det || p.bio ? `<h3>Про гравця</h3>${det}${p.bio ? `<p class="ps" style="margin:.6rem 0 0">${p.bio}</p>` : ""}` : ""}
    </div>`;
  }
};
const labels = { home: "Головна", schedule: "Тренування", rent: "Оренда столів", tournaments: "Турніри", rating: "Рейтинг", players: "Гравці", stats: "Статистика" };
function initCarousel() {
  const c = document.getElementById("car"), d = [...document.querySelectorAll("#dots i")];
  if (!c || !d.length) return;
  const sl = [...c.children], pad = () => parseFloat(getComputedStyle(c).paddingLeft);
  const upd = () => {
    let i = 0, b = 1e9;
    sl.forEach((s, k) => { const x = Math.abs(s.offsetLeft - pad() - c.scrollLeft); if (x < b) { b = x; i = k; } });
    if (c.scrollLeft + c.clientWidth >= c.scrollWidth - 2) i = sl.length - 1;
    d.forEach((e, k) => e.classList.toggle("on", k === i));
  };
  c.addEventListener("scroll", upd, { passive: true });
  d.forEach((e, k) => e.addEventListener("click", () => c.scrollTo({ left: sl[k].offsetLeft - pad(), behavior: "smooth" })));
  upd();
}
function route() {
  const h = (location.hash || "#home").slice(1);
  const tm = h.match(/^t-(.+)$/), pm = h.match(/^p-(.+)$/);
  const k = tm ? "tournaments" : pm ? "players" : (h !== "home" && h !== "tournament" && h !== "player" && views[h] ? h : "");
  const app = document.getElementById("app");
  if (!app.dataset.ok) { app.innerHTML = views.home(); app.dataset.ok = "1"; initCarousel();
    if (matchMedia("(prefers-reduced-motion:reduce)").matches) app.querySelectorAll(".hx animateMotion").forEach(a => { const c = a.parentNode; a.remove(); c.setAttribute("cx", 268); c.setAttribute("cy", 46); });
  }
  const m = document.getElementById("modal");
  if (k) {
    document.getElementById("mb").innerHTML = tm ? views.tournament(tm[1]) : pm ? views.player(pm[1]) : views[k]();
    m.hidden = false; document.body.style.overflow = "hidden";
    document.getElementById("sc").scrollTop = 0;
    document.getElementById("mx").focus({ preventScroll: true });
  } else { m.hidden = true; document.body.style.overflow = ""; }
}
const closeM = () => { location.hash = "#home"; };
document.getElementById("mx").addEventListener("click", closeM);
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeM(); });
addEventListener("keydown", e => { if (e.key === "Escape") closeM(); });
addEventListener("hashchange", route); route();
</script>
